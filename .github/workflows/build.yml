name: Build Ultron APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Inject API Key and Nuke Typo
      run: |
        sed -i 's/"dummy-key"/"${{ secrets.ULTRON_API_KEY }}"/g' app/src/main/java/com/ultron/agent/MainActivity.kt
        sed -i 's/!I.checkSelfPermission()/!Shizuku.checkSelfPermission()/g' app/src/main/java/com/ultron/agent/MainActivity.kt

    - name: Build Debug APK
      run: gradle :app:assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Ultron-APK
        path: app/build/outputs/apk/debug/*.apk
